    <meta charset="UTF-8" />
    <script>
      // Environment constraint: HMR is disabled in AI Studio iframe; handle Vite client gracefully
      (function() {
        ['error', 'warn', 'info', 'log', 'debug', 'trace'].forEach(function(method) {
          const orig = console[method];
          console[method] = function() {
            var args = Array.prototype.slice.call(arguments);
            var text = args.map(function(a) {
              if (typeof a === 'string') return a;
              try { return JSON.stringify(a); } catch(_) { return String(a); }
            }).join(' ');
            if (text.includes('[vite]') || text.includes('vite-hmr') || text.includes('WebSocket') || text.includes('failed to connect to websocket')) {
              return;
            }
            if (orig) orig.apply(console, args);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || e.filename || '')) || '';
          if (String(msg).includes('[vite]') || String(msg).includes('@vite')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) || '';
          if (String(reason).includes('[vite]') || String(reason).includes('WebSocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        const OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            if (urlStr.includes('vite') || protoStr.includes('vite-hmr') || protoStr.includes('vite-ping')) {
              const target = new EventTarget();
              const fakeWs = {
                url,
                readyState: 1, // OPEN
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
                if (typeof fakeWs.onopen === 'function') fakeWs.onopen(new Event('open'));
              }, 20);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>
