<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#041f18" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Islamic 8-Point Star Border / Rub el Hizb -->
  <g transform="translate(256, 256) scale(1.6)" filter="url(#shadow)">
    <!-- Square 1 -->
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.4" />
    <!-- Square 2 rotated 45 deg -->
    <rect x="-70" y="-70" width="140" height="140" rx="14" fill="none" stroke="url(#gold)" stroke-width="5" opacity="0.4" transform="rotate(45)" />

    <!-- Inner circle border -->
    <circle r="60" fill="#022c22" stroke="url(#gold)" stroke-width="4" />
  </g>

  <!-- Center Quranic Symbol ۞ -->
  <text x="256" y="278" font-family="'Amiri', 'Cairo', serif" font-size="160" font-weight="bold" fill="url(#gold)" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
    ۞
  </text>

  <!-- Title Subtext: مصحف ورش -->
  <text x="256" y="420" font-family="'Cairo', sans-serif" font-size="34" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    جامع الحفظ · ورش
  </text>
</svg>
